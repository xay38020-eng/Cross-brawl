en:[['M1','Punch, punch, kick.'],['Q · Knives','Throws 3 knives across 3 lanes.'],['E · MUDA','A barrage of energy fists with a wide hitbox.'],['R · Road Roller','A road roller falls from above: area damage and stun.'],['ULT · The World','Stops time for 5s; Q and E have almost no cooldown; damage is stored.'],['Special','Stand: The World, flowing cape. In 1v1 can clash Ults and barrages.'],['Hidden combo','M1 x3 then R within 0.7s: the roller drops right on the nearest enemy, with a bigger, stronger blast.']]}};

INF.ben={vi:[['M1','Đấm, đấm, đá.'],['R · Omnitrix','Mở Omnitrix 8 giây. Trong lúc chọn alien Ben bất tử. Bấm R lần nữa để huỷ.'],['Q / E (khi mở Omnitrix)','Chuyển trái / phải để chọn alien.'],['T / Num8','Biến hình thành alien đang chọn trong 25 giây. Lúc này Q/E là kỹ năng của alien, R để đổi lại thành Ben (chờ 3 giây mới dùng lại).'],['Đặc biệt','Ben không có Ult. Mỗi alien có buff, ngoại hình và animation riêng.'],['Combo ẩn','Không có.']].concat(AL.map(a=>[a.n,a.d.vi+' · Buff: '+a.bt.vi])),

INF.cid={vi:[['M1','Chém kiếm slime tím 3 nhát.'],['Q · Slime Slash','Vệt chém tím bay xuyên mục tiêu.'],['E · Shadow Step','Lướt trong bóng tối và chém 3 nhịp.'],['R · Mandala','Mở vòng Mandala: sát thương vùng 36 và choáng 0.5 giây.'],['ULT · I Am Atomic','Tụ lực khoảng 2.4 giây (Cid hô "I Am Atomic"), rồi tạo ra một vùng tròn tím phủ toàn map trong 3 giây. Mọi mục tiêu trong vùng chịu sát thương liên tục, tổng 90 (60 ở 1v1), bị làm chậm; xong thì Cid được +1 Aura.'],['Nội tại','Khi bị đánh có 0.5% tỉ lệ né, tóm lấy kẻ vừa đánh (choáng 2.5 giây) và lập tức tung I Am Atomic miễn phí.'],['Aura','Mỗi lần xong I Am Atomic (cả Ult lẫn nội tại) được +1 Aura: +15% sát thương, giảm 20% sát thương nhận, hồi chiêu +5%. Cộng dồn tối đa 10.'],['Combo ẩn','Không có.']],
en:[['M1','3-hit violet slime-sword combo.'],['Q · Slime Slash','A violet slash that pierces targets.'],['E · Shadow Step','Dash through the shadows with 3 slashes.'],['R · Mandala','Opens a Mandala: 36 area damage and a 0.5s stun.'],['ULT · I Am Atomic','Charges for about 2.4s (Cid says "I Am Atomic"), then creates a violet circular zone covering the whole map for 3s. Every target inside takes continuous damage, 90 in total (60 in 1v1), and is slowed; Cid gains +1 Aura afterwards.'],['Passive','When hit there is a 0.5% chance to dodge, seize the attacker (2.5s stun) and instantly unleash a free I Am Atomic.'],['Aura','Every finished I Am Atomic (Ult or passive) grants +1 Aura: +15% damage, 20% less damage taken, +5% cooldown speed. Stacks up to 10.'],['Hidden combo','None.']]};
INF.ichigo={vi:[['M1','Chém Zangetsu 3 nhát, nhát 3 mạnh hơn. Ở Bankai đánh cực nhanh.'],['Q · Shunpo','Dịch chuyển ra sau lưng kẻ địch và chém; nhát chém xuyên giáp nhẹ và làm chậm mục tiêu 1 giây.'],['E · Getsuga','Làn sóng trăng lưỡi liềm bay nhanh hơn, hitbox lớn hơn, xuyên mục tiêu.'],['R · Chém nặng','Cú chém xuống hất văng và choáng.'],['Combo ẩn · Getsuga Cận Chiến','M1 ×3 rồi bấm E trong 0.7 giây: Getsuga bùng nổ ngay trước mặt, sát thương lớn và hất đối thủ ra xa.'],['Nội tại · Linh áp bộc phát','Khi máu dưới 40%: nhận khiên ảo 15% máu tối đa, đánh nhanh hơn 20% và hồi ULT nhanh hơn trong 5 giây (hồi lại sau 30 giây).'],['ULT · Getsuga Tenshō','Làn sóng trăng khổng lồ xuyên cả màn hình (85 sát thương).'],['T · Shikai','Mở khi dùng Ult 1 lần hoặc gây 250 sát thương. +10% sát thương, Getsuga mạnh hơn, giảm 15% hồi chiêu Q và E.'],['T · Bankai (Tensa Zangetsu)','Từ Shikai, mở khi dùng Ult 2 lần hoặc gây 600 sát thương. Sát thương ×2, né 10%, +30% tốc độ chạy, đánh nhanh hơn, giảm 30% hồi chiêu mọi kỹ năng; áo choàng rách, hắc kiếm mỏng và linh áp đen.'],['Bankai · Q Tốc Kích Tàn Ảnh','Lướt để lại chuỗi tàn ảnh đen, chém xuyên giáp sau lưng mục tiêu. Bấm Q lần nữa trong 2 giây để đổi hướng hoặc truy đuổi.'],['Bankai · E Kuroi Getsuga Tenshō','Lưỡi đao đen viền đỏ bay nhanh gấp đôi, xuyên mục tiêu và gây chảy máu 3 giây.'],['Bankai · R Tốc Kích Tensa','Ichigo biến mất chớp nhoáng, lướt xuyên qua mọi mục tiêu trên một đường thẳng và để lại dải hắc ngân xen kẽ linh áp đỏ rực. Sau 0,3 giây dải này phát nổ thành cột Hắc Nguyệt, gây sát thương cực lớn và làm choáng kẻ địch 0,8 giây.'],['Bankai · Combo ẩn','Giữ M1 1 giây, thả ra rồi bấm E trong 0.7 giây: lao vào chém liên hoàn 6 nhát, kết thúc bằng Hắc Nguyệt cận chiến hất văng hoặc làm choáng 1 giây.'],['Bankai · ULT Tensa Getsuga','Ichigo biến mất, vòng tàn ảnh chém 5 nhát từ mọi hướng; nhát cuối xuất hiện ở giữa và phóng cột Hắc Nguyệt khổng lồ nổ diện rộng.'],['Lưu ý','Shikai/Bankai, số lần dùng Ult và điểm sát thương được tính lại khi bị hạ gục hoặc sang round mới.']],en:[['M1','3-hit Zangetsu combo, the 3rd is stronger. Very fast in Bankai.'],['Q · Shunpo','Flash behind an enemy and slash; the slash lightly pierces armor and slows the target for 1s.'],['E · Getsuga','A crescent wave that flies faster, has a larger hitbox and pierces targets.'],['R · Heavy cut','A downward slash with knockback and stun.'],['Hidden combo · Close-range Getsuga','M1 x3 then E within 0.7s: a Getsuga bursts right in front of you for big damage and knocks the enemy far back.'],['Passive · Reiatsu surge','Below 40% HP: gain a virtual shield worth 15% of max HP, attack 20% faster and recover ULT faster for 5s (recharges after 30s).'],['ULT · Getsuga Tensh\u014d','A giant crescent wave across the whole screen (85 damage).'],['T · Shikai','Unlocks after 1 Ult use or 250 damage dealt. +10% damage, stronger Getsuga, -15% cooldown on Q and E.'],['T · Bankai (Tensa Zangetsu)','From Shikai, unlocks after 2 Ult uses or 600 damage dealt. Damage x2, 10% dodge, +30% move speed, faster attacks, -30% cooldown on all skills; torn coat, slim black blade and black reiatsu.'],['Bankai · Q Zangetsu Flash','Dash leaving a chain of black afterimages and slash through armor behind the target. Press Q again within 2s to change direction or chase.'],['Bankai · E Kuroi Getsuga Tensh\u014d','A black blade edged in red that flies twice as fast, pierces targets and causes bleeding for 3s.'],['Bankai · R Tensa Rush','Ichigo vanishes in a flash and dashes through every target on a straight line, leaving a black trail laced with blazing red reiatsu. After 0.3s the trail detonates into Black Moon columns that deal massive damage and stun enemies for 0.8s.'],['Bankai · Hidden combo','Hold M1 for 1s, release, then press E within 0.7s: rush in with 6 chained slashes ending in a close-range Black Moon that knocks back or stuns for 1s.'],['Bankai · ULT Tensa Getsuga','Ichigo vanishes; a ring of afterimages slashes 5 times from every direction, then he appears in the middle and fires a giant Black Moon column that explodes over a wide area.'],['Note','Shikai/Bankai, Ult uses and damage points reset on KO or at a new round.']]};

let m=0;NET.GK.forEach((n,i)=>{if(keys[CT[0][n]])m|=1<<i});if(NET.nr&&(m!==NET.im||T-NET.it>1)){NET.im=m;NET.it=T;NET.nr.presence({i:m,hb:(NET.hb=(NET.hb||0)+1)})}

if(cb){const t=nearT(p);if(t&&dist(p,t)<230){p.an='kick';p.at=p.ad=.4;snd('scissor');p.x=clamp(t.x-p.dir*40,30,W-30);p.y=clamp(t.y,395,555);dealt(p,t,40);if(t.t!=='boss'&&t.t!=='dummy'){t.x=p.dir>0?W-40:40;t.stun=Math.max(t.stun,2.2)}else t.stun=Math.max(t.stun,1);G.sh=.5;G.fx.push({k:'ring',x:t.x,y:t.y,r:100,l:.35,c:p.sw},{k:'arc',x:p.x,y:p.y,d:p.dir,r:90,l:.25,c:'#fff'});txt(p.x,p.y-115,'COMBO!',p.sw);return}}
p.akd=.32;p.an='p1';p.at=p.ad=.32;snd('dash')}

function akTick(dt){const a=G.ak,o=a.o;a.t-=dt;a.tk-=dt;if(a.tk<=0){a.tk=.05;for(let i=0;i<2;i++){const x=40+Math.random()*(W-80),y=400+Math.random()*150;G.fx.push({k:'ring',x,y,r:70,l:.35,c:Math.random()<.5?a.c:'#fff'});targets(o).forEach(t=>{if(Math.hypot(t.x-x,(t.y-y)*2)<75+t.r){sure(o,t,G.duel?5:7);if(t.t!=='boss'&&t.t!=='dummy')t.stun=Math.max(t.stun,.45)}})}if(Math.random()<.3)snd('shock')}if(a.t<=0){G.ak=null;o.root=0}}
function akFx(){const a=G.ak,u=Math.min(1,(a.d-a.t)/.5),fade=a.t<.5?a.t/.5:1,cx=a.x,cy=a.y,R=Math.max(1,1200*u),ry=R*.45,c=a.c||(a.o&&a.o.sw)||'#35e0c8';X.save();X.globalAlpha=fade;
const g=X.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,c+'55');g.addColorStop(.8,c+'22');g.addColorStop(1,c+'11');X.fillStyle=g;X.beginPath();X.ellipse(cx,cy,R,ry,0,0,6.29);X.fill();X.strokeStyle=c;X.lineWidth=5;X.beginPath();X.ellipse(cx,cy,R,ry,0,0,6.29);X.stroke();
for(let i=1;i<=3;i++){X.strokeStyle='rgba(255,255,255,'+(.5-i*.1)+')';X.lineWidth=3;X.beginPath();X.ellipse(cx,cy,R*i/3.2,ry*i/3.2,0,0,6.29);X.stroke()}
X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();for(let i=0;i<8;i++){const an=i/8*6.283+T*.35,l=i%2?.55:1;X.moveTo(cx,cy);X.lineTo(cx+Math.cos(an)*R*l,cy+Math.sin(an)*ry*l)}X.stroke();
X.strokeStyle=c;X.lineWidth=2;X.beginPath();for(let i=0;i<6;i++){const an=i/6*6.283-T*.5;X.moveTo(cx+Math.cos(an)*R*.2,cy+Math.sin(an)*ry*.2);X.lineTo(cx+Math.cos(an)*R*.5,cy+Math.sin(an)*ry*.5)}X.stroke();X.restore()}

G.fx.push({k:'bm',x:x0,y:y0,x2:p.x,y2:p.y,l:.3,c:'#ff2a1a'},{k:'sl',x:p.x+p.dir*30,y:p.y,d:p.dir,l:.2,c:'#ffb14a'});G.sh=.25;snd('slash')}

later(.05,()=>{if(p.dead)return;G.ts={o:p,t:2.3,d:2.3,t0:T,cap:.55};const nx=p.x<W/2?W-60:60;G.fx.push({k:'bm',x:p.x,y:p.y,x2:nx,y2:p.y,l:.5,c:'#ff4a2a'});p.x=nx;p.dir=nx>W/2?-1:1;p.fa=p.dir>0?0:Math.PI;G.sh=.4;

function yTick(p,k,dt){p.mcd=Math.max(0,(p.mcd||0)-dt);if(p.mode>0){p.mode-=dt;if(p.mode<=0)p.mode=0}if(keys[k.t]&&!p.pt&&!(p.mode>0)&&!(p.mcd>0)){p.mode=15;p.mcd=28;G.sh=.25;G.fx.push({k:'ring',x:p.x,y:p.y,r:100,l:.4,c:'#ff2a1a'});txt(p.x,p.y-135,'HÁCH KIẾM!','#ff4a2a');snd('omni')}p.pt=keys[k.t]}
function modeAura(p){glow(p.x,p.y-60,100,'rgba(255,50,20,.4)');X.strokeStyle='rgba(255,120,40,.75)';X.lineWidth=3;X.beginPath();for(let i=0;i<10;i++){const ax=p.x+(i-4.5)*9,ay=p.y-10-((T*75+i*37)%95);X.moveTo(ax,ay+18);X.lineTo(ax+Math.sin(T*6+i)*3,ay)}X.stroke()}
function burnFx(x,y,h){for(let i=0;i<4;i++){const ax=x+(i-1.5)*8,ay=y-h*.3-((T*60+i*23)%(h*.7));X.fillStyle='rgba(255,'+(120+i*30)+',40,.8)';X.beginPath();X.arc(ax,ay,3.5,0,6.29);X.fill()}}
INF.akaza={vi:[['M1','Đấm thẳng, gối, đá móc. Nhát thứ 3 có vụ nổ nhẹ quanh điểm trúng.'],['Q · Không Thức','Đấm vào không khí tạo 3 luồng sóng xung kích bay nhanh về phía trước (3 làn).'],['E · Loạn Thức','Lướt nhanh về phía trước; chỉ khi lao trúng mục tiêu mới tung loạt đấm liên hoàn (hitbox rộng).'],['R · Diệt Thức','Tích lực rồi giáng xuống đất: vụ nổ diện rộng hất văng và choáng mọi kẻ địch xung quanh.'],['ULT · Thanh Ngân Loạn Tàn Quang','Akaza đứng yên 5 giây, một La Bàn khổng lồ mở ra phủ toàn map; hàng trăm vụ nổ xung kích ngẫu nhiên gây sát thương và choáng diện rộng.'],['Đặc biệt','Da nhợt nhạt, vạch xanh trên mặt và thân, đòn đánh phát sáng xanh ngọc. Có thể đối đầu loạt đấm với Jotaro/Dio trong 1v1.'],['Combo ẩn','M1 ×3 rồi E trong 0.7 giây: Loạn Thức thành cú đá cắt kéo hất đối thủ ra mép màn hình và choáng sâu hơn (Boss không bị hất).']],
en:[['M1','Straight punch, knee, hook kick. The 3rd hit has a small blast.'],['Q · Air Form','Punching the air fires 3 fast shockwaves forward (3 lanes).'],['E · Chaotic Form','A fast dash forward; the punch barrage only triggers if the dash connects (wide hitbox).'],['R · Annihilation Form','Charge, then slam the ground: a wide blast knocks back and stuns everything around.'],['ULT · Compass Needle','Akaza stands still for 5s as a huge compass opens across the map; hundreds of random shock bursts deal damage and stun over a wide area.'],['Special','Pale skin, blue markings, teal glowing strikes. Can clash barrages with Jotaro/Dio in 1v1.'],['Hidden combo','M1 x3 then E within 0.7s: Chaotic Form becomes a scissor kick that sends the enemy to the screen edge with a deeper stun (bosses are not moved).']]};
INF.yoriichi={vi:[['M1','Chém kiếm 3 nhịp. Nhát thứ 3 để lại vệt lửa dài trên mặt đất, lan sát thương.'],['Q · Viên Vũ','Lưỡi liềm lửa khổng lồ bay cực nhanh xuyên mọi mục tiêu trên map.'],['E · Huyễn Nhật Hồng','Lướt chớp nhoáng ra sau lưng kẻ địch gần nhất, để lại tàn ảnh lửa: ai chạm vào bị bỏng và làm chậm.'],['R · Nhật Vựng Trùng Đầu Vũ','Hóa luồng sáng đỏ, lướt dích dắc 3 lần vào mục tiêu gần nhất; mỗi lần gây sát thương lớn và để lại lửa cháy trên mặt đất. Bất tử trong lúc lướt.'],['T · Ấn Diệt Quỷ & Hách Kiếm','15 giây: kiếm đỏ rực, đòn đánh lờ mọi giảm sát thương của đối thủ và cấm họ hồi máu. Hồi lại sau khoảng 28 giây.'],['ULT · Thức thứ 13','Lướt qua cả màn hình, ngưng đọng thời gian 2 giây; hàng chục vệt chém lửa dồn lại rồi bùng nổ cùng lúc, thiêu cháy 6 giây (tối đa 55% máu trong 1v1).'],['Đặc biệt','Mọi đòn đánh đều gây hiệu ứng thiêu đốt (sát thương theo thời gian).'],['Combo ẩn','M1 ×3 rồi Q trong 0.7 giây: Viên Vũ thành cột lốc xoáy lửa bao quanh Yoriichi trong 3 giây, hút kẻ địch vào và đốt máu liên tục.']],
en:[['M1','3-hit sword combo. The 3rd hit leaves a long fire trail on the ground that spreads damage.'],['Q · Dance','A giant fire crescent flies very fast through every target on the map.'],['E · Illusory Sun','Flash behind the nearest enemy, leaving a fire afterimage: anything touching it is burned and slowed.'],['R · Halo Dragon Head Dance','Turn into a red light and zigzag 3 times at the nearest target; each dash deals big damage and leaves fire on the ground. Invulnerable while dashing.'],['T · Demon Slayer Mark & Crimson Blade','15s: glowing red blade, attacks ignore all enemy damage reduction and block their healing. About 28s cooldown.'],['ULT · 13th Form','Dash across the whole screen and stop time for 2s; dozens of fire slashes build up then burst at once, burning for 6s (max 55% HP in 1v1).'],['Special','Every attack applies burning (damage over time).'],['Hidden combo','M1 x3 then Q within 0.7s: the crescent becomes a fire whirlwind around Yoriichi for 3s, pulling enemies in and burning them.']]};
INF.nullsword={vi:[['Máu & Ngai vàng Null','Máu 1B. Đứng yên 5 giây: một ngai vàng đen có ngôi sao Null hiện ra phía sau, Nullsword ngồi xuống, miễn nhiễm mọi sát thương vật lý và giảm 50% sát thương phép. Cử động hoặc ra chiêu là đứng dậy. Mọi sát thương của Nullsword là sát thương Null (xuyên mọi thứ, kể cả miễn thương).'],['M1','Chém tạo vết nứt đen viền trắng theo đường chéo, gây 1B (1 tỷ) sát thương lên mọi thứ trên đường.'],['Q · Nullstar','Lướt một đường xa để lại vết nứt ngang. Vết nứt mở thành ngôi sao Null, hút toàn bộ mục tiêu (kể cả boss) vào trong và nuốt chửng. Cảnh đóng lại rất lâu, kết thúc là chắc chắn chết.'],['E · Mưa pha lê','Tạo một ngôi sao Null trên trời. 1M pha lê đen rơi xuống ngẫu nhiên khắp bản đồ, lần lượt nhưng liên tục. Pha lê chạm mục tiêu là xoá sổ ngay, bỏ qua máu, giáp, thủ và bất tử (trừ máu vô cực / bất tử của phòng luyện tập).'],['R · Biến mất','Mở cổng đưa bản thân và đồng đội biến khỏi bản đồ trong 30 giây (không chết). Sau 0,1s xuất hiện 10 thuộc hạ vô hạn máu, không bị khống chế, mỗi nhát chém gây 1M sát thương. Hết giờ, cổng mở lại ở chỗ đã biến mất.'],['Ult · Null','Chém hai vết nứt ngang dọc phía sau bản đồ, vết nứt mở rộng thành bản đồ độc quyền với ngôi sao Null ở giữa. Trong bản đồ này mọi mục tiêu bị đứng yên (kể cả miễn khống chế), sau 1 giây bị xoá sổ.'],['Lưu ý','Mở khoá bằng code. Không chơi được chế độ 1v1.']],en:[['HP & Null Throne','HP 1B. Stand still for 5s: a black throne topped with the Null star appears behind you and Nullsword sits down, immune to all physical damage and taking 50% less magic damage. Move or cast to stand up. All Nullsword damage is Null damage (pierces everything, even invincibility).'],['M1','A black crack with a white edge slashes diagonally for 1B (1 billion) damage to everything on its path.'],['Q · Nullstar','Dash far, leaving a horizontal crack that opens into a Nullstar. It pulls in and devours every target, bosses included. The long closing animation ends in certain death.'],['E · Crystal rain','Creates a Null star in the sky. 1M black crystals fall at random across the whole map, one after another without pause. A crystal touching a target erases it instantly, ignoring HP, armor, defense and invincibility (except infinite HP / training-room immunity).'],['R · Vanish','Opens a gate so you and allies vanish from the map for 30s (not dead). 0.1s later 10 minions with infinite HP and no crowd control appear, each slash dealing 1M damage. After 30s a gate reopens where you vanished.'],['Ult · Null','Slashes two cracks across the back of the map which widen into an exclusive map with the Nullstar in the middle. Inside it every target is frozen in place (even those immune to crowd control) and erased after 1 second.'],['Note','Unlocked with a code. Cannot be played in 1v1.']]};
INF.aizen={vi:[['M1','Chuỗi 3 nhát chém Kyoka Suigetsu. Nhát thứ 3 xé một vết chém không gian nhỏ đẩy lùi mục tiêu.'],['Q · Hado #90 Kurohitsugi (Hắc Quán)','Niệm chú trong chớp mắt, một hộp không gian đen hình chữ nhật úp trùm lên kẻ địch ở khoảng cách trung bình. Hộp siết chặt, gây sát thương liên tục trong 1,5 giây rồi nổ áp lực hất mục tiêu ra xa.'],['E · Kyoka Suigetsu (Thôi Miên)','Lướt nhẹ ra sau và để lại phân thân ảo ảnh tại chỗ cũ (5 giây). Kẻ địch chạm hoặc tấn công trúng phân thân sẽ bị thôi miên 1,5 giây: đảo ngược hướng di chuyển và đánh chậm hơn.'],['R · Hado #63 Raikoho (Lôi Hỏa Pháo)','Bắn một quả cầu sấm sét xanh trắng cực nhanh (nhanh hơn Kurohitsugi) xuyên mục tiêu, nổ sát thương tức thì và làm tê liệt (chậm) 1,2 giây. Hợp để nối sau M1.'],['ULT · Kyoka Suigetsu - Kanzen Saimin','Aizen giơ kiếm lên trời. Trong 3,5 giây màn hình phủ sương mù, đối thủ bị thôi miên: kỹ năng bị khóa, điều khiển đảo ngược (kẻ địch quái thì đi ngược và đánh chậm); giao diện của người chơi bị che sương. Aizen né thêm 30%.'],['Lưu ý','Hiện có dạng cơ bản; các dạng tiến hóa chưa được thêm.']],en:[['M1','A 3-hit Kyoka Suigetsu chain. The 3rd hit tears a small space cut that pushes the target back.'],['Q · Hado #90 Kurohitsugi (Black Coffin)','Chants in an instant and a rectangular black box of space drops over enemies at medium range. It tightens for 1.5s dealing continuous damage, then bursts and throws targets far away.'],['E · Kyoka Suigetsu (Hypnosis)','Glide back a little, leaving an illusory decoy where you stood (5s). Enemies that touch or hit the decoy are hypnotized for 1.5s: reversed movement and slower attacks.'],['R · Hado #63 Raikoho (Thunder Roar Cannon)','Fires a blue-white lightning sphere faster than Kurohitsugi that pierces targets, deals instant damage and paralyzes (slows) for 1.2s. Great after M1.'],['ULT · Kyoka Suigetsu - Kanzen Saimin','Aizen raises his sword to the sky. For 3.5s mist covers the screen and the opponent is hypnotized: skills locked and controls reversed (enemy monsters walk backwards and attack slower); the victim HUD is fogged. Aizen gains +30% dodge.'],['Note','Only the base form exists for now; evolved forms are not added yet.']]};
INF.hakari={vi:[['M1','Đấm móc, đấm, đá kiểu đường phố. Nhát 3 đẩy lùi nhẹ và có sóng nhịp điệu.'],['Q · Đóng Cửa','Lao tới tóm đối thủ gần nhất (trong 240px) rồi quật xuống đất: sát thương và choáng 0.7 giây. Khung máy quay số lướt qua màn hình.'],['E · Cửa Sập','Lao tới nhanh rồi tung cú đấm lực cửa tàu, hất văng xa và choáng 0.7 giây.'],['R · Nghi Thức Đặt Cược','Gọi 3 cánh cửa tàu đóng sập liên tiếp phía trước; bất tử 0.6 giây khi gọi, mỗi cánh gây sát thương vùng và choáng nhẹ.'],['ULT · Idle Death Gamble','Mở lãnh địa Pachinko, quay máy 3.6 giây và đốt sát thương nhẹ chắc chắn trúng. 30% trúng Jackpot 7-7-7: đầy máu, bất tử 4.11 giây đầu, 100% chí mạng, +15% sát thương và hồi chiêu +10% trong 4 phút 11 giây; suốt thời gian này không thể dùng Ult. Trượt thì nhận giáp ảo 45 trong 8 giây.'],['Nội tại · May mắn','Mỗi lần M1 trúng có 14% nhận giáp +12 hoặc tăng tốc độ đánh 3 giây.'],['Combo ẩn','M1 ×3 rồi R trong 0.7 giây: thành cú đá Cửa Đóng Sập tầm trung, choáng 1.1 giây.']],
en:[['M1','Street-style hook, punch, kick. The 3rd hit knocks back slightly with a beat wave.'],['Q · Door Close','Lunge at the nearest enemy (within 240px), grab and slam them down: damage and 0.7s stun. A slot-machine frame sweeps across the screen.'],['E · Door Slam','Fast dash into a subway-door-force punch with heavy knockback and a 0.7s stun.'],['R · Betting Ritual','Summons 3 train doors that slam shut one after another ahead of you; 0.6s invulnerability on cast, each door deals area damage and a short stun.'],['ULT · Idle Death Gamble','Opens a Pachinko domain, spins for 3.6s with sure-hit chip damage. 30% chance of 7-7-7 Jackpot: full heal, 4.11s invulnerability at the start, 100% crits, +15% damage and +10% cooldown speed for 4 minutes 11 seconds; the Ult is locked for that whole time. A miss grants a 45-point phantom shield for 8s.'],['Passive · Luck','Each M1 hit has a 14% chance to grant +12 shield or 3s of faster attacks.'],['Hidden combo','M1 x3 then R within 0.7s: a mid-range Door Slam kick with a 1.1s stun.']]};
INF.pucci={vi:[['T · Tiến hóa','Tiến hóa theo quá trình. Whitesnake → C-Moon: tích đủ 100 điểm Thanh Tiến Hóa (đánh trúng địch bằng M1 hoặc chiêu), rồi bấm T để gọi Green Baby và chạm vào em để lên C-Moon (Green Baby biến mất sau 15 giây nếu không nhặt). C-Moon → Made in Heaven: thanh tiến hóa tăng chậm hơn; khi đủ 100 bấm T, Pucci đứng niệm ấn định tọa độ trong 2 giây (giáp bá thể: giảm 50% sát thương, không bị choáng) rồi bay lên, bứt phá không gian thành Made in Heaven và hạ xuống gây choáng. Bị hạ gục hoặc sang round mới thì về dạng đầu.'],
['WHITESNAKE · M1','Chuỗi đấm hiểm hóc. Nhát 3 xé một chiếc đĩa bay ngắn (tầm xa nhẹ) làm chậm mục tiêu.'],['Q · DISC Extract','Lao tới chọc tay vào đầu đối phương: khóa ngẫu nhiên 1 kỹ năng (Q/E/R) 4 giây (quái bị choáng 1,2s) và Pucci hồi 15% máu cùng 15 năng lượng ULT.'],['E · Melted Acid Illusion','Sương axit 4,5 giây: làm chậm 50%, liên tục mất máu; người chơi đứng trong sương bị nhòe giao diện.'],['R · Illusion Gun','Rút súng bắn 3 phát đạn linh áp rực cháy. Phát thứ 3 nổ đẩy lùi và ngắt chiêu (Cancel) của kẻ địch.'],['ULT · Memory & Stand DISC','Lao tới bóp cổ đối thủ gần nhất: khóa Q E R F Dash của họ 6 giây, và bạn mượn được Q của họ dùng 1 lần trong 8 giây.'],['Combo ẩn · Illusion Melt','M1 ×3 rồi Q trong 0.7 giây: tia axit gây sát thương, làm chậm và làm nhiễu màn hình đối thủ 2 giây.'],
['C-MOON · M1','Mỗi cú đấm làm méo mó không gian quanh mục tiêu: nhát 1-2 kéo lại gần, nhát 3 đẩy ra.'],['Q · Inversion Punch','Cú đấm cực mạnh: trúng thì mục tiêu bị lộn ngược 2 giây (đảo điều khiển) và nhận thêm sát thương theo % máu đã mất.'],['E · Gravitational Repulsion','Đập đất hất tung mọi kẻ địch xung quanh lên không rồi rơi xuống cực mạnh như trọng lực gấp 10, choáng 1,2 giây.'],['R · Shifted Gravity','Bẻ cong hướng trọng lực: kẻ địch bị hút lao mạnh vào tường hoặc vật cản gần nhất, chịu sát thương va đập lớn và choáng.'],['ULT · Surface Reversal Inversion','Mọi kẻ địch bị hất tung lật ngược lên sát trần 2.4 giây chịu sát thương liên tục, rồi bị đập xuống: sát thương lớn, choáng 1.2 giây và để lại hố chấn động.'],['Combo ẩn · Gravity Pierce','M1 ×3 rồi Q trong 0.7 giây: ép đối thủ gần nhất dập mặt xuống đất, vùng chấn động choáng 0.8 giây.'],['Combo ẩn · Heart Inversion','M1 ×3 rồi E trong 0.7 giây: đấm xuyên ngực, đẩy văng ra mép màn hình và gây chảy máu 4 giây.'],
['MADE IN HEAVEN · M1','Đấm chém cực nhanh (hồi chiêu M1 giảm gần một nửa) kèm chuỗi tàn ảnh, di chuyển lướt nhanh hơn.'],['Q · Speed Acceleration','Lướt chớp nhoáng tạo vô số bóng mờ quanh đối thủ, chém liên tục 10 nhát trong 0,5 giây. Không thể né hoặc dùng giáp đỡ.'],['E · Time Acceleration Knife Throw','Phóng loạt dao bay với tốc độ ánh sáng, để lại dải vệt sáng đâm xuyên mọi mục tiêu trên đường thẳng.'],['R · Time Skip','Biến mất 0.3 giây (bất tử) rồi hiện ra sau lưng đối thủ gần nhất.'],['ULT · Universe Reset','Màn hình chuyển trắng đen, mặt trời và mặt trăng quay cuồng nhanh dần, bản đồ chớp sáng tối. Trong 10 giây: toàn bản đồ chịu sát thương đè nén, kẻ địch bị làm chậm 80%, Pucci di chuyển nhanh gấp 3. Pucci bị hạ gục trước khi hết giờ thì Ult kết thúc; còn sống hết 10 giây thì mọi mục tiêu bị xoá sổ, kể cả bất tử.'],['Combo ẩn · Time Acceleration Dash','M1 ×3 rồi R trong 0.7 giây: biến mất 0.3 giây rồi hiện sau lưng đối thủ XA nhất, chí mạng và làm mới hồi chiêu Q.']],
en:[['T · Evolution','Evolution is a process. Whitesnake → C-Moon: fill the Evolution bar to 100 by hitting enemies with M1 or skills, then press T to summon the Green Baby and touch it to become C-Moon (it vanishes after 15s). C-Moon → Made in Heaven: the bar fills more slowly; at 100 press T and Pucci stands chanting the coordinates for 2s (super armor: 50% less damage, cannot be stunned), then flies up, breaks space into Made in Heaven and lands with a stun. Reverts on KO or at a new round.'],
['WHITESNAKE · M1','A nasty punch chain. Hit 3 rips out a short-range flying disc that slows the target.'],['Q · DISC Extract','Lunge and jab a hand into the enemy head: locks one random skill (Q/E/R) for 4s (monsters are stunned 1.2s) and Pucci heals 15% HP plus 15 ULT energy.'],['E · Melted Acid Illusion','Acid fog for 4.5s: 50% slow and constant damage; players standing in it get a blurred HUD.'],['R · Illusion Gun','Draws a pistol and fires 3 blazing reiatsu bullets. The 3rd bursts, pushes back and cancels the enemy skill.'],['ULT · Memory & Stand DISC','Rush the nearest enemy and choke them: they cannot use Q E R F Dash for 6s, and you borrow their Q once within 8s.'],['Hidden combo · Illusion Melt','M1 x3 then Q within 0.7s: an acid beam that damages, slows and scrambles the enemy screen for 2s.'],
['C-MOON · M1','Every punch warps space around the target: hits 1-2 pull in, hit 3 pushes away.'],['Q · Inversion Punch','A huge punch: on hit the target is flipped upside down for 2s (controls reversed) and takes extra damage based on missing HP.'],['E · Gravitational Repulsion','Slam the ground: every nearby enemy is thrown into the air and falls back as if under 10x gravity, stunned for 1.2s.'],['R · Shifted Gravity','Bends the direction of gravity: enemies are dragged into the nearest wall or obstacle taking big impact damage and a stun.'],['ULT · Surface Reversal Inversion','Every enemy is thrown upside down to the top of the screen for 2.4s taking continuous damage, then slammed down: heavy damage, 1.2s stun and a big crater.'],['Hidden combo · Gravity Pierce','M1 x3 then Q within 0.7s: slams the nearest enemy face-first into the ground; the shock stuns for 0.8s.'],['Hidden combo · Heart Inversion','M1 x3 then E within 0.7s: a punch through the chest that sends the enemy to the screen edge and bleeds them for 4s.'],
['MADE IN HEAVEN · M1','Lightning punches and slashes (M1 cooldown nearly halved) with afterimages, and faster movement.'],['Q · Speed Acceleration','Dash in a flash creating countless shadows around the enemy and slash 10 times in 0.5s. It cannot be dodged or blocked.'],['E · Time Acceleration Knife Throw','Throws a volley of knives at light speed, leaving a streak of light that pierces every target on the line.'],['R · Time Skip','Vanish for 0.3s (invulnerable) and reappear behind the nearest enemy.'],['ULT · Universe Reset','The screen turns black and white, the sun and moon spin faster and faster and the map strobes. For 10s: crushing damage across the whole map, enemies slowed by 80% and Pucci moving 3x faster. If Pucci is KO\'d before time runs out the Ult ends; if he is alive after 10s every target is erased, even immortal ones.'],['Hidden combo · Time Acceleration Dash','M1 x3 then R within 0.7s: vanish for 0.3s and reappear behind the FARTHEST enemy with a crit, refreshing your Q cooldown.']]};

const APPV=37;let ACC=null,UD=null,updPend=false,updT=0,svT=0,PROFAV=0;const PLAT={user:null,db:null,uid:null,pname:''};
const AVS=['🙂','😎','🤖','👾','🦊','🐺','🐉','🔥','⚡','❄️','🌑','⭐','🗡️','👑','🎯','🧛','🧟','👻','🥷','🧙','🦸','🐲','🌸','🍀'];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newUD=(name,av)=>({account_level:{level:1,current_exp:0,exp_to_next_level:100},overall_stats:{total_play_time_seconds:0,total_games_played:0,total_wins:0},by_mode:{},by_theme:{},records:{highest_wave:0,highest_score:0},name,av,cfg:null,created:Date.now()});
const fixUD=u=>{u=u||{};const d=newUD(u.name||'Player',u.av||'🙂');return Object.assign(d,u,{account_level:Object.assign(d.account_level,u.account_level||{}),overall_stats:Object.assign(d.overall_stats,u.overall_stats||{}),records:Object.assign(d.records,u.records||{}),by_mode:u.by_mode||{},by_theme:u.by_theme||{}})};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LSOK=(()=>{try{const k='mc_t';localStorage.setItem(k,'1');const v=localStorage.getItem(k)==='1';localStorage.removeItem(k);return v}catch(e){return false}})();
const STANDALONE=typeof claude==='undefined';
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
async function platInit(){try{if(typeof claude==='undefined')return;try{PLAT.user=await tmo(claude.use('user'),12000)}catch(e){}try{PLAT.db=await tmo(claude.use('db'),12000)}catch(e){}if(PLAT.user){const me=await tmo(PLAT.user.me(),12000);PLAT.uid=me.id;PLAT.pname=me.name||''}}catch(e){}}
async function cloudGet(k){try{if(!PLAT.db||!PLAT.uid)return null;const sn=await tmo(PLAT.db.doc('data/users/'+PLAT.uid+'/'+k).get(),6000);return sn.exists?sn.data():null}catch(e){return null}}
async function cloudSet(k,v){try{if(PLAT.db&&PLAT.uid)await tmo(PLAT.db.doc('data/users/'+PLAT.uid+'/'+k).set(v),15000)}catch(e){}}
const rid=()=>'MC-'+String(100000+Math.floor(Math.random()*900000));
async function hashPw(pw,salt){const d=new TextEncoder().encode(salt+':'+pw),h=await crypto.subtle.digest('SHA-256',d);return b64u(new Uint8Array(h))}
function cfgSnap(){return{sel:SET.sel,lang:SET.lang,gfx:SET.gfx,fps:SET.fps,snd:SET.snd,vol:SET.vol,sv:SET.sv,dev:SET.dev,diff:SET.diff}}
function saveSET(){if(!ACC||ACC.type==='guest')return;try{localStorage.setItem('mc_set',JSON.stringify(SET))}catch(e){}UD.cfg=cfgSnap();saveUD()}
function saveUD(now){if(!ACC||ACC.type==='guest'||!UD)return;clearTimeout(svT);const go=()=>{const t=Date.now();if(!ACC.bk.length||t-ACC.bk[0].t>600000){ACC.bk.unshift({t,ud:JSON.parse(JSON.stringify(UD))});ACC.bk.length=Math.min(ACC.bk.length,3)}
const pl=ACC.type==='plat',fb=ACC.type==='fb',ts=Date.now(),rec=(pl||fb)?{id:ACC.id,ts,ud:UD,bk:ACC.bk}:{id:ACC.id,ts,salt:ACC.salt,hash:ACC.hash,ud:UD,bk:ACC.bk},key=pl?'mc_prof_'+PLAT.uid:fb?'mc_prof_fb_'+ACC.uid:'mc_acc_'+ACC.user;lsSet(key,rec);try{LASTSV=JSON.parse(localStorage.getItem(key)).ts===ts}catch(e){LASTSV=false}if(fb)fbPut(rec);else cloudSet(pl?'prof':'acc_'+ACC.user,JSON.parse(JSON.stringify(rec)))};now?go():svT=setTimeout(go,1500)}
function setAcc(a,ud){ACC=a;ACC.bk=ACC.bk||[];UD=fixUD(ud);if(a.type!=='guest'&&UD.cfg){try{Object.assign(SET,UD.cfg);SET.sel=[0,1].map(i=>{const q=(SET.sel||[])[i];return q&&CH[q.ch]&&q.co>=0&&q.co<3?{ch:q.ch,co:q.co}:{ch:'flame',co:i}});SET.sv=Object.assign({d:'n',t:600,th:'basic'},SET.sv||{});if(SET.p2==='net')SET.p2='human'}catch(e){}}
if(a.type!=='guest'){lsSet('mc_last',{t:a.type,u:a.user||'',uid:a.type==='plat'?PLAT.uid:a.type==='fb'?a.uid:''});if(a.user)lsSet('mc_user',a.user);clearInterval(updT);updT=setInterval(chkUpd,60000);chkUpd()}migTitles();checkTitles();renderAccBar();applySet();$('ov').style.display='none';menu()}
async function platLogin(silent){if(!PLAT.uid){if(!silent)showGate(tx('eNoPlat'));return}const c0=await cloudGet('prof'),l0=lsGet('mc_prof_'+PLAT.uid);let rec=(c0&&l0)?((l0.ts||0)>(c0.ts||0)?l0:c0):(c0||l0);if(!rec||!rec.ud)rec={id:rid(),ud:newUD(PLAT.pname||'Player','🙂'),bk:[]};setAcc({type:'plat',id:rec.id,bk:rec.bk||[]},rec.ud);saveUD(1)}
async function localReg(u,pw){u=String(u||'').trim();if(!/^[\w.-]{3,16}$/.test(u))return showGate(tx('eUser'));if(String(pw||'').length<4)return showGate(tx('ePass'));
if(lsGet('mc_acc_'+u)||await cloudGet('acc_'+u))return showGate(tx('eExists'));const salt=Math.random().toString(36).slice(2,10),hash=await hashPw(pw,salt),rec={id:rid(),salt,hash,ud:newUD(u,AVS[Math.random()*AVS.length|0]),bk:[]};
setAcc({type:'local',user:u,id:rec.id,salt,hash,bk:[]},rec.ud);saveUD(1)}
async function localLogin(u,pw){u=String(u||'').trim();const l0=lsGet('mc_acc_'+u),c0=await cloudGet('acc_'+u),rec=(l0&&c0)?((l0.ts||0)>=(c0.ts||0)?l0:c0):(l0||c0);if(!rec||!rec.hash)return showGate(tx('eNo'));if(await hashPw(pw||'',rec.salt)!==rec.hash)return showGate(tx('eWrong'));
setAcc({type:'local',user:u,id:rec.id,salt:rec.salt,hash:rec.hash,bk:rec.bk||[]},rec.ud);saveUD(1)}
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const q=atob(t),u=new Uint8Array(q.length);for(let i=0;i<q.length;i++)u[i]=q.charCodeAt(i);return u};
let XPORT='',XMSG='',PMSG='',LASTSV=true;
function exportAcc(){const o={v:1,u:ACC.user,id:ACC.id,s:ACC.salt,h:ACC.hash,ud:UD};return 'MC1.'+b64u(new TextEncoder().encode(JSON.stringify(o)))}
function copyTxt(t){const fb=()=>{const a=$('xcode');if(a){a.focus();a.select();try{document.execCommand('copy');XMSG=tx('xfCopied')}catch(e){XMSG=tx('xfSel')}renderProf()}};try{navigator.clipboard.writeText(t).then(()=>{XMSG=tx('xfCopied');renderProf()},fb)}catch(e){fb()}}
async function importAcc(c){c=String(c||'').trim();try{if(!c.startsWith('MC1.'))throw 0;const o=JSON.parse(new TextDecoder().decode(unb64u(c.slice(4))));if(!o||!o.s||!o.h||!/^[\w.-]{3,16}$/.test(o.u||''))throw 0;const old=lsGet('mc_acc_'+o.u),np=x=>((x&&x.ud&&x.ud.overall_stats)||{}).total_games_played||0;if(!old||np({ud:o.ud})>=np(old))lsSet('mc_acc_'+o.u,{id:o.id||rid(),salt:o.s,hash:o.h,ud:fixUD(o.ud),bk:[]});lsSet('mc_user',o.u);showGate(tx('xfOk')+o.u)}catch(e){showGate(tx('xfBad'))}}

function saveName(){const el=$('pname');if(!el||!ACC||ACC.type==='guest')return;const nm=String(el.value||'').replace(/[<>]/g,'').trim().slice(0,16);if(nm){UD.name=nm;saveUD(1);PMSG=profChk()}else PMSG='\u26A0 '+tx('nameBad');renderAccBar();renderProf()}

INF.steve={vi:[['M1','Đấm 3 đòn. Cầm Kiếm/Rìu/Cung/Khiên/Giáo/Trùy/Đinh ba (ô đang chọn) sẽ đổi kiểu đánh: kiếm chém, rìu nặng, cung bắn tên, khiên đẩy lùi và đỡ lâu hơn, giáo/đinh ba đâm xa, trùy đập có sóng xung.'],['Q','Gần Bàn chế tạo/Đe rèn: mở menu (◀ ▶ chọn, T đồng ý, Q đóng). Không có block gần: chế 1 gỗ thành 2 gậy.'],['E','Đặt block đang chọn (Bàn chế tạo, Bàn phù phép, Đe rèn, Đất). Có 4 gỗ và chưa có Bàn chế tạo: chế ra Bàn chế tạo.'],['R','Chuyển sang ô kế tiếp trong túi đồ 10 ô dưới chân.'],['T','Gần Bàn phù phép: mở menu phù phép (3 vàng, ngẫu nhiên: Sắc bén, Hỏa thuật, Đẩy lùi, Sức mạnh, Bảo vệ, Gai). Trong menu: T để đồng ý.'],['Nội tại','Gây hoặc nhận sát thương, và cứ vài giây, sẽ nhận nguyên liệu: gỗ, sắt, vàng, kim cương, netherite. Nguyên liệu không nằm trong túi đồ.'],['Công thức (Bàn chế tạo)','Kiếm: 1 gậy + 2 NL cấp; Rìu: 2 gậy + 3 NL cấp; Giáo: 3 gậy + 2 NL cấp; Giáp: 15 NL cấp; Cung: 3 gỗ + 1 sắt; Khiên: 1 gỗ + 5 sắt; Đinh ba: 1 gậy + 3 kim cương; Trùy: 1 gậy + 5 netherite; Bàn phù phép: 2 kim cương + 4 sắt; Đe rèn: 7 sắt. Tự chọn cấp cao nhất đủ nguyên liệu (sắt trắng, vàng, kim cương xanh, netherite nâu đen).'],['Đe rèn','Nâng 1 cấp vũ khí đang cầm hoặc giáp (6 nguyên liệu cấp kế tiếp).'],['Block','Mỗi loại Bàn/Đe chỉ có 1 cái. Khối đất: 1 chồng 64 khối, chặn đạn và cản quái.'],['ULT','Cần cầm Trùy, Giáo hoặc Đinh ba. Trùy: bay lên giữa map rồi lao xuống tạo địa chấn toàn map (gần thì đau). Giáo: bay ngang qua lại khắp map. Đinh ba: đào xuống, bay lên và tạo 2 sóng thần hai bên.']],
en:[['M1','3-hit punch. Holding a Sword/Axe/Bow/Shield/Spear/Mace/Trident (selected slot) changes the attack: slashes, heavy chops, arrows, shield bash and longer parry, long thrusts, mace smash with shock.'],['Q','Near a Crafting Table/Anvil: opens its menu (◀ ▶ choose, T confirm, Q close). Otherwise turns 1 wood into 2 sticks.'],['E','Places the selected block (Crafting Table, Enchanting Table, Anvil, Dirt). With 4 wood and no Crafting Table it crafts one.'],['R','Cycles to the next of the 10 hotbar slots under your feet.'],['T','Near an Enchanting Table: opens the enchant menu (3 gold, random: Sharpness, Fire Aspect, Knockback, Power, Protection, Thorns). In menus T confirms.'],['Passive','Dealing or taking damage, and every few seconds, drops materials: wood, iron, gold, diamond, netherite. Materials are not in the hotbar.'],['Recipes (Crafting Table)','Sword: 1 stick + 2 tier mats; Axe: 2 sticks + 3; Spear: 3 sticks + 2; Armor: 15 tier mats; Bow: 3 wood + 1 iron; Shield: 1 wood + 5 iron; Trident: 1 stick + 3 diamond; Mace: 1 stick + 5 netherite; Enchanting Table: 2 diamond + 4 iron; Anvil: 7 iron. Picks the highest tier you can afford (iron white, gold, diamond blue, netherite dark).'],['Anvil','Upgrades the held weapon or armor by one tier (6 mats of the next tier).'],['Blocks','Only one of each Table/Anvil. Dirt: one stack of 64, blocks projectiles and slows monsters.'],['ULT','Needs a Mace, Spear or Trident. Mace: fly to map center and dive for a map-wide quake (closer = more damage). Spear: fly back and forth across the map. Trident: dig, rocket up and send two tsunamis left and right.']]};
